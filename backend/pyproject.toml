[project]
name = "adapty-referee"
version = "0.1.0"
description = "Adapty Experimentation Referee: deterministic A/B decision copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=referee.stats --cov-report=term-missing --cov-fail-under=100"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
